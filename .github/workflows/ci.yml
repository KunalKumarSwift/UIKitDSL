name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test (iOS ${{ matrix.ios }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        ios: ["17.0", "16.0", "15.0"]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -clonedSourcePackagesDirPath .build/checkouts

      - name: Build and test
        run: |
          xcodebuild test \
            -scheme UIKitDSL-Package \
            -destination "platform=iOS Simulator,name=iPhone 15 Pro,OS=${{ matrix.ios }}" \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || true

  lint:
    name: Swift Package Structure
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Package.swift
        run: swift package dump-package > /dev/null

      - name: Check for unresolved merge conflicts
        run: |
          if grep -rn "<<<<<<< " Sources/ Tests/; then
            echo "Merge conflicts found"
            exit 1
          fi
          echo "No merge conflicts found"
